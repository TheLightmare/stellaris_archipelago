name: Release

# Tag a commit `v*` (e.g. v0.2.0) and push the tag:
#   git tag v0.2.0 && git push origin v0.2.0
# This builds the DLL from source and attaches to the GitHub release:
#   - stellaris.apworld                    (drop into Archipelago/worlds)
#   - stellaris-archipelago-vX.Y.Z.zip     (full player package incl. DLL)

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build DLL (Release)
        run: |
          cmake -B dll/build -S dll -A x64
          cmake --build dll/build --config Release

      - name: Verify static CRT
        shell: python
        run: |
          from pathlib import Path
          data = Path("dll/build/Release/version.dll").read_bytes().lower()
          bad = [n for n in (b"vcruntime140", b"msvcp140", b"api-ms-win-crt") if n in data]
          if bad:
              raise SystemExit(f"DLL dynamically links the CRT: {bad}")
          print("static CRT OK")

      - name: Build packages
        run: python scripts/make_release.py --dll dll/build/Release/version.dll
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/stellaris.apworld
            dist/stellaris-archipelago-${{ github.ref_name }}.zip
          generate_release_notes: true
